{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <h3 class="mb-3">Métodos de pago</h3>

    <form id="payment-form">
        {% csrf_token %}
        <!-- Stripe renderizará el Payment Element completo aquí -->
        <div id="payment-element" class="mb-3"></div>

        <button id="submit" class="btn btn-primary w-100 mt-3" data-secret="{{ client_secret }}">
            <div class="spinner border-spinner spinner-border-sm d-none" id="spinner"></div>
            <span id="button-text">Agregar tarjeta</span>
        </button>

        <div id="payment-message" class="text-danger mt-2"></div>
    </form>
</div>

<script>
    var STRIPE_PUBLIC_KEY = '{{ stripe_public_key }}';
    var CLIENT_SECRET = '{{ client_secret }}';
</script>

<!-- CDN oficial v3 -->
<script src="https://js.stripe.com/v3/"></script>
<script src="{% static 'js/index.js' %}"></script>
{% endblock %}
