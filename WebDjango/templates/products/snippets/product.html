<div class="card h-100 shadow-sm border-0 bg-white rounded">
    {% if i.image %}
    <img src="{{i.image.url}}" class="card-img-top object-fit-contain p-2" alt="{{i.title}}" height="150">
    {% endif %}

    <div class="card-body d-flex flex-column">
        <h5 class="card-title fw-bold text-dark mb-2">{{i.title}}</h5>
        <p class="card-text text-muted small mb-4">{{i.description}}</p>
        <a href="{% url 'product' i.slug %}" class="btn btn-primary mt-auto fw-semibold py-2 w-100">
            Mas info
        </a>
    </div>
</div>
