{% extends "base.html" %}



{% block content %}
<div class="col">
    {% if product.image %}
    <img src="{{product.image.url}}" alt="Imagen de {{ product.title }}" width="250" height="250"
        class="img-fluid rounded">
    {% endif %}
    <div class="h1">{{product.title}}
        <div class="h5 font weight-bold">
            Precio: <span class="text-danger">${{product.price}}</span>
            </span>
        </div>
    </div>
    <div class="mb-4">
        <p class="text-muted lh-base" style="max-width: 500px;">
            {{ product.description }}
        </p>
    </div>
    <div>
        {% include 'cart/snippets/add.html' %}
    </div>

    {% endblock %}
