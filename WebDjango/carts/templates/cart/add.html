{% extends 'base.html' %}
{% load funcion_tag %}

{% block content %}
<div class="col-12 mt-4">
    <div class="alert alert-success d-flex align-items-center" role="alert">
        <span class="fa-solid fa-circle-check me-2"></span>
        ¡Producto agregado al carrito con éxito!
    </div>
</div>

<div class="col-md-2 col-4">
    {% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.title }}" class="img-thumbnail" width="100" height="100">
    {% endif %}
</div>

<div class="col-md-7 col-8 d-flex flex-column justify-content-center">
    <h4 class="mb-1">
        <a href="{% url 'product' product.slug %}" class="text-decoration-none text-dark fw-bold">
            {{ product.title }}
        </a>
    </h4>
    <p class="text-muted mb-0">Cantidad: 1</p>
</div>

<div class="col-md-3 col-12 d-flex align-items-center justify-content-md-end mt-2 mt-md-0">
    <span class="h5 text-danger fw-bold">
        {{ product.price|precio_tag }}
    </span>
</div>
{% endblock %}
